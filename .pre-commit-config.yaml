# See https://pre-commit.com — install hooks with: pre-commit install --install-hooks
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Generic hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Enforce Conventional Commit messages (type(scope): description)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Project checks — run against the real toolchains (uv / pnpm)
  - repo: local
    hooks:
      - id: pytest
        name: backend tests (pytest)
        entry: bash -c 'cd backend && uv run pytest -q'
        language: system
        types: [python]
        pass_filenames: false
        files: ^backend/

      - id: eslint
        name: frontend lint (eslint)
        entry: bash -c 'cd frontend && pnpm lint'
        language: system
        types_or: [ts, tsx, javascript, jsx]
        pass_filenames: false
        files: ^frontend/
