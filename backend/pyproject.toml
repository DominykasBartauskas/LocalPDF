[project]
name = "backend"
version = "0.1.0"
description = "LocalPDF — A self-hosted PDF toolkit for merging, splitting, rotating, compressing and more. No uploads, no limits, fully private."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "pikepdf>=10.3.0",
    "pillow>=12.1.1",
    "pypdf>=6.7.5",
    "python-multipart>=0.0.22",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
